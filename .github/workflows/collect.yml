name: collect-feeds

# 🚗/🤖 ニュース用の記事を集めて feeds ブランチに置くワークフロー
# - 毎日 3:17 / 5:17 / 6:17 / 12:17 / 18:17 JST に動く（GitHub の定時実行は遅れたり飛ばされたりするので多めに）
# - feeds-request ブランチへの push でも動く（手動で今すぐ集めたいとき用）
# 保存するのは「題名・URL・日付・RSSの要約・数値を含む文の抜き出し」だけで、記事全文は保存しない。
# Claude の定期タスクは feeds ブランチを clone して JSON を読むだけ（ウェブを開かない）。
on:
  schedule:
    - cron: "17 18,20,21 * * *"
    - cron: "17 3,9 * * *"
  push:
    branches: [feeds-request]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-feeds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser==6.0.11 trafilatura==1.12.2 requests==2.32.3

      - name: restore previous
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          if git fetch -q --depth 1 origin feeds 2>/dev/null; then
            for t in auto ai; do
              git show "FETCH_HEAD:$t.json" > "$RUNNER_TEMP/work/$t.json" 2>/dev/null || rm -f "$RUNNER_TEMP/work/$t.json"
            done
          fi

      - name: collect
        run: python collector/collect.py "$RUNNER_TEMP/work"

      - name: publish to feeds branch
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          cp "$RUNNER_TEMP/work/auto.json" "$RUNNER_TEMP/work/ai.json" "$RUNNER_TEMP/work/status.json" "$OUT/"
          printf '# feeds ブランチ（自動生成）\ncollect-feeds ワークフローが毎回上書きします。消さないでください。\n' > "$OUT/README.md"
          cd "$OUT"
          git init -q -b feeds
          git config user.name "feed-collector"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "feeds: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feeds
