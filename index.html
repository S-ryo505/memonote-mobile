<!DOCTYPE html>
<!-- =====================================================================
     MemoNote Mobile  v1.1.0
     スマホで書いた勉強ノートを、会社の MemoNote へメールで送るためのアプリです。
     書いた内容は端末の中だけに残り、送信するときだけ外に出ます。
     ===================================================================== -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>MemoNote Mobile</title>
<style>
:root{
  --ink:#0E1420; --panel:#161E2C; --raise:#1D2739;
  --line:#2A3547; --line-soft:#212B3C;
  --tx:#E4E9F2; --tx-dim:#8494AC; --tx-faint:#5B6B85;
  --teal:#37C2D0; --amber:#E8A33D; --coral:#E8654F; --violet:#9B87F5; --green:#4FBE8A;
  --sans:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--tx);font-family:var(--sans);
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---------- 骨格 ---------- */
.app{display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.mark{width:26px;height:26px;flex:none;border:2px solid var(--teal);border-radius:7px;position:relative}
.mark::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;background:var(--teal);
  transform:translateY(-50%);box-shadow:0 -6px 0 -0.5px var(--teal),0 6px 0 -0.5px var(--tx-faint)}
.top b{font-size:15px;letter-spacing:.02em}
.top .sp{margin-left:auto}
.icb{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px;color:var(--tx-dim);flex:none}
.icb:active{background:var(--raise)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(96px + var(--safe-b))}
.view{display:none}
.view.on{display:block}

/* ---------- 一覧 ---------- */
.hint{color:var(--tx-dim);font-size:13px;margin:0 0 14px}
.card{border:1px solid var(--line);border-radius:13px;background:var(--panel);
  padding:13px 15px;margin-bottom:11px;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left}
.card:active{background:var(--raise)}
.card.sent{opacity:.55}
.card .pick{width:26px;height:26px;border-radius:8px;border:2px solid var(--tx-faint);flex:none;
  display:grid;place-items:center;font-size:14px;color:transparent;margin-top:2px}
.card.on .pick{background:var(--teal);border-color:var(--teal);color:#04141A}
.card .bd{flex:1;min-width:0}
.card .ti{font-weight:700;font-size:15.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ex{font-size:13px;color:var(--tx-dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .mt{font-size:11.5px;color:var(--tx-faint);display:flex;gap:7px;flex-wrap:wrap;margin-top:3px}
.card .mt i{font-style:normal;font-family:var(--mono)}
.card .badge{font-family:var(--mono);font-size:10.5px;border:1px solid var(--amber);color:var(--amber);
  border-radius:4px;padding:0 6px;flex:none;margin-top:3px}
.card .badge.ok{border-color:var(--green);color:var(--green)}
.empty{padding:44px 10px;text-align:center;color:var(--tx-faint);font-size:14px;line-height:2}

/* ---------- 下のバー ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + var(--safe-b));display:flex;gap:10px;align-items:center;z-index:20}
.big{flex:1;background:var(--teal);color:#04141A;font-weight:700;border-radius:12px;
  padding:14px 16px;font-size:16px;text-align:center}
.big:active{filter:brightness(.9)}
.big.ghost{background:transparent;color:var(--tx-dim);border:1px solid var(--line);flex:none;padding:14px 18px}
.big[disabled]{opacity:.4}

/* ---------- 編集 ---------- */
.ttl{width:100%;background:none;border:none;font-size:21px;font-weight:700;padding:0;margin:0 0 10px;line-height:1.4}
.ttl:focus{outline:none}
.ttl::placeholder{color:var(--tx-faint);font-weight:400}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13.5px;color:var(--tx-dim)}
.chip.on{border-color:var(--violet);color:var(--violet);background:rgba(155,135,245,.12)}
.chip.tag{font-family:var(--mono);font-size:12.5px}
.chip.add{border-style:dashed;color:var(--tx-faint)}
.row{display:flex;gap:9px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.row .lb{font-size:12.5px;color:var(--tx-faint);width:52px;flex:none}
.fld{flex:1;min-width:130px;background:var(--ink);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;font-size:16px}
.fld:focus{outline:none;border-color:var(--teal)}
.fld::placeholder{color:var(--tx-faint)}
.lvl{display:flex;gap:6px}
.lvl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  font-family:var(--mono);font-size:14px;color:var(--tx-faint)}
.lvl button.on{background:var(--teal);color:#04141A;border-color:var(--teal);font-weight:700}

.bl{position:relative;margin-bottom:10px}
.bl .del{position:absolute;right:-4px;top:-4px;width:30px;height:30px;border-radius:50%;
  background:var(--raise);border:1px solid var(--line);color:var(--tx-faint);font-size:15px;
  display:grid;place-items:center;z-index:2}
.ed{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;font-size:16px;line-height:1.8;resize:none;overflow:hidden;min-height:52px}
.ed:focus{outline:none;border-color:var(--teal)}
.ed::placeholder{color:var(--tx-faint)}
.ed.h{font-size:17px;font-weight:700;background:transparent;border-color:transparent;
  border-bottom:1px solid var(--line);border-radius:0;padding:8px 2px;min-height:0}
.ed.q{border-left:3px solid var(--line)}
.imgbl{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
.imgbl img{display:block;width:100%;height:auto}
.imgbl input{width:100%;background:transparent;border:none;border-top:1px solid var(--line-soft);
  padding:10px 13px;font-size:13px;color:var(--tx-dim)}
.imgbl input:focus{outline:none;color:var(--tx)}
.fbl{border:1px solid var(--line);border-left:3px solid var(--green);border-radius:11px;
  background:var(--panel);overflow:hidden}
.fbl textarea{width:100%;background:transparent;border:none;font-family:var(--mono);font-size:16px;
  padding:13px 14px;resize:none;overflow:hidden;min-height:48px}
.fbl textarea:focus{outline:none}
.symrow{display:flex;gap:1px;background:var(--line-soft);border-top:1px solid var(--line-soft)}
.symrow input{flex:1;min-width:0;background:var(--panel);border:none;padding:9px 11px;font-size:14px}
.symrow input:first-child{font-family:var(--mono);color:var(--teal);max-width:34%}
.symrow input:last-child{font-family:var(--mono);color:var(--tx-faint);max-width:28%}
.symrow input:focus{outline:none;background:var(--raise)}
.fbl .more{width:100%;padding:9px;font-size:13px;color:var(--tx-faint);border-top:1px solid var(--line-soft)}
.qbl{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:11px;background:var(--panel)}
.qbl textarea{width:100%;background:transparent;border:none;padding:12px 14px;font-size:16px;resize:none;overflow:hidden;min-height:44px}
.qbl textarea:first-child{font-weight:700}
.qbl textarea:last-child{border-top:1px dashed var(--line-soft);color:var(--tx-dim);font-size:15px}
.qbl textarea:focus{outline:none}
.add{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.add button{border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:14px;color:var(--tx-dim)}
.add button:active{background:var(--raise)}
.sec{font-size:12.5px;color:var(--tx-faint);margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line-soft)}

.sheet{position:fixed;inset:0;background:rgba(6,10,16,.7);display:none;align-items:flex-end;z-index:60}
.sheet.on{display:flex}
.sheet .in{background:var(--panel);border-radius:16px 16px 0 0;width:100%;padding:20px 18px calc(20px + var(--safe-b));
  border-top:1px solid var(--line);max-height:86dvh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:17px}
.sheet p{margin:0 0 16px;font-size:13.5px;color:var(--tx-dim)}
.sheet label{display:block;font-size:12.5px;color:var(--tx-faint);margin:12px 0 5px}
.sheet .fld{width:100%}
.sheet .btns{display:flex;gap:10px;margin-top:20px}

.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translate(-50%,12px);
  background:var(--raise);border:1px solid var(--teal);border-radius:11px;padding:11px 20px;
  font-size:14px;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--coral)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark"></div>
    <b id="topttl">MemoNote</b>
    <span class="sp"></span>
    <button class="icb" id="backbtn" style="display:none">←</button>
    <button class="icb" id="delbtn" style="display:none">🗑</button>
    <button class="icb" id="menubtn">⋯</button>
  </header>

  <main class="main" id="main">
    <!-- 一覧 -->
    <section class="view on" id="v-list">
      <p class="hint" id="listhint"></p>
      <div id="cards"></div>
    </section>

    <!-- 編集 -->
    <section class="view" id="v-edit">
      <input class="ttl" id="etitle" placeholder="学んだことの題名">
      <div class="chips" id="efields"></div>
      <div class="row"><span class="lb">テーマ</span>
        <input class="fld" id="etopic" placeholder="例: 車両運動" list="topiclist">
        <datalist id="topiclist"></datalist></div>
      <div class="row"><span class="lb">出典</span>
        <input class="fld" id="esrc" placeholder="例: 自動車の運動と制御 4章"></div>
      <div class="row"><span class="lb">理解度</span>
        <span class="lvl" id="elvl"></span></div>
      <div class="chips" id="etags"></div>

      <div id="blocks"></div>

      <div class="add">
        <button data-add="text">＋ 文章</button>
        <button data-add="heading">＋ 見出し</button>
        <button data-add="image">＋ 写真</button>
        <button data-add="paste">＋ 貼り付け</button>
        <button data-add="formula">＋ 式</button>
        <button data-add="qa">＋ 問い</button>
      </div>

      <div class="sec">要約</div>
      <textarea class="ed" id="esummary" placeholder="3行以内。空でも構いません"></textarea>
      <button class="chip" id="aibtn" style="margin-top:9px">AI に要約してもらう</button>

      <div class="sec">業務でどう使うか</div>
      <textarea class="ed" id="eapplied" placeholder="1行でよいので書いておくと、会社で ToDo にできます"></textarea>
    </section>
  </main>

  <div class="bottom" id="bottom"></div>
</div>

<div class="sheet" id="sheet"><div class="in" id="sheetin"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filepick" accept="image/*" style="display:none">
<input type="file" id="restorepick" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* =====================================================================
   1. 保存（端末の中だけ）
   ===================================================================== */
const KEY = "mnm_drafts_v1";
const SKEY = "mnm_settings_v1";
let SET = {mailTo:""};        /* 送り先の会社アドレス */
function loadSet(){
  try{ SET = Object.assign({mailTo:""}, JSON.parse(localStorage.getItem(SKEY) || "{}")); }
  catch(_){ SET = {mailTo:""}; }
}
function saveSet(){ try{ localStorage.setItem(SKEY, JSON.stringify(SET)); }catch(_){} }
const APP_VERSION = "1.1.0";
let D = [];            /* 下書きの配列 */
let cur = null;        /* 編集中の下書き */
let picked = new Set();/* 一覧で選んだもの */

function load(){
  loadSet();
  try{ D = JSON.parse(localStorage.getItem(KEY) || "[]"); }
  catch(_){ D = []; }
  if(!Array.isArray(D)) D = [];
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(KEY, JSON.stringify(D)); }
    catch(e){ toast("端末の空きが足りません。送信して減らしてください", true); }
  }, 250);
}
function saveNow(){
  clearTimeout(saveTimer);
  try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(_){}
}

/* =====================================================================
   2. 道具
   ===================================================================== */
const $ = s => document.querySelector(s);
const uid = () => "m_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const nowISO = () => { const d = new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+
         pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); };
const shortDate = s => { const d = new Date(s); return isNaN(d) ? ""
  : (d.getMonth()+1)+"/"+d.getDate()+" "+pad(d.getHours())+":"+pad(d.getMinutes()); };
const FIELDS = ["技術","マネジメント","その他"];

function toast(msg, bad){
  const t = $("#toast");
  t.textContent = msg; t.className = "toast on" + (bad ? " bad" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "toast" + (bad ? " bad" : ""), 2400);
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt != null) e.textContent = txt;
  return e;
}
function autoGrow(t){
  t.style.height = "auto";
  t.style.height = (t.scrollHeight + 2) + "px";
}
function excerpt(d){
  const t = (d.blocks||[]).filter(b => b.type === "text" || b.type === "heading")
    .map(b => b.text||"").join(" ").trim();
  return t.slice(0, 60);
}

/* =====================================================================
   3. 画面の切り替え
   ===================================================================== */
let view = "list";
function go(v){
  view = v;
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("on", x.id === "v-"+v));
  $("#backbtn").style.display = v === "edit" ? "" : "none";
  $("#delbtn").style.display = v === "edit" ? "" : "none";
  $("#topttl").textContent = v === "edit" ? "下書き" : "MemoNote";
  $("#main").scrollTop = 0;
  renderBottom();
  if(v === "list") renderList();
}
$("#backbtn").onclick = () => { saveNow(); go("list"); };
$("#aibtn").onclick = () => { if(cur) openAI(); };
$("#delbtn").onclick = () => {
  if(!cur) return;
  const nm = cur.title ? "「" + cur.title + "」" : "この下書き";
  if(!confirm(nm + "を消します。元に戻せません。")) return;
  D = D.filter(x => x.id !== cur.id);
  picked.delete(cur.id);
  cur = null; saveNow(); go("list");
  toast("消しました");
};

/* =====================================================================
   4. 一覧
   ===================================================================== */
function renderList(){
  const box = $("#cards"); box.innerHTML = "";
  const unsent = D.filter(d => !d.sentAt).length;
  $("#listhint").textContent = D.length
    ? "未送信 " + unsent + "件。送るものを選んで、下の「会社に送る」を押します。"
    : "";
  if(!D.length){
    box.appendChild(el("div","empty",
      "まだ下書きがありません。\n下の「＋ 新しく書く」から始められます。"));
    return;
  }
  [...D].sort((a,b) => (b.createdAt||"").localeCompare(a.createdAt||"")).forEach(d => {
    const c = el("button","card" + (picked.has(d.id) ? " on" : "") + (d.sentAt ? " sent" : ""));
    const p = el("span","pick","✓");
    p.onclick = e => {
      e.stopPropagation();
      picked.has(d.id) ? picked.delete(d.id) : picked.add(d.id);
      renderList(); renderBottom();
    };
    c.appendChild(p);
    const bd = el("span","bd");
    bd.appendChild(el("span","ti", d.title || "（無題）"));
    bd.appendChild(el("span","ex", excerpt(d) || "本文なし"));
    const mt = el("span","mt");
    mt.appendChild(el("i", null, shortDate(d.createdAt)));
    if(d.field) mt.appendChild(el("span", null, d.field));
    if(d.topic) mt.appendChild(el("span", null, d.topic));
    const nImg = (d.blocks||[]).filter(b => b.type === "image").length;
    if(nImg) mt.appendChild(el("span", null, "写真" + nImg));
    bd.appendChild(mt);
    c.appendChild(bd);
    c.appendChild(el("span","badge" + (d.sentAt ? " ok" : ""), d.sentAt ? "送信済" : "未送信"));
    c.onclick = () => openDraft(d.id);
    box.appendChild(c);
  });
}

/* =====================================================================
   5. 下のバー
   ===================================================================== */
function renderBottom(){
  const b = $("#bottom"); b.innerHTML = "";
  if(view === "edit"){
    const back = el("button","big","書き終わり");
    back.onclick = () => { saveNow(); go("list"); };
    const send = el("button","big ghost","送る");
    send.onclick = () => { saveNow(); picked = new Set([cur.id]); share(); };
    b.append(back, send);
    return;
  }
  const n = picked.size;
  const add = el("button","big ghost","＋ 新しく書く");
  add.onclick = () => newDraft();
  const send = el("button","big", n ? "会社に送る（" + n + "件）" : "会社に送る");
  send.disabled = !n;
  send.onclick = share;
  b.append(add, send);
}

/* =====================================================================
   6. 下書きを作る・開く
   ===================================================================== */
function newDraft(prefill){
  const d = Object.assign({
    id: uid(), createdAt: nowISO(), updatedAt: nowISO(),
    title: "", field: "技術", topic: "", source: "", level: 0, tags: [],
    summary: "", applied: "", sentAt: null,
    blocks: [{type:"heading", text:"要点"}, {type:"text", text:""},
             {type:"heading", text:"自分の言葉で"}, {type:"text", text:""}]
  }, prefill || {});
  D.push(d); save();
  openDraft(d.id);
  return d;
}
function openDraft(id){
  cur = D.find(x => x.id === id);
  if(!cur){ go("list"); return; }
  renderEdit();
  go("edit");
}
function touch(){ if(cur){ cur.updatedAt = nowISO(); save(); } }

/* =====================================================================
   7. 編集画面
   ===================================================================== */
function renderEdit(){
  const d = cur;
  const ti = $("#etitle"); ti.value = d.title || "";
  ti.oninput = () => { d.title = ti.value; touch(); };

  const fb = $("#efields"); fb.innerHTML = "";
  FIELDS.forEach(f => {
    const b = el("button","chip" + (d.field === f ? " on" : ""), f);
    b.onclick = () => { d.field = f; touch(); renderEdit(); };
    fb.appendChild(b);
  });

  const tp = $("#etopic"); tp.value = d.topic || "";
  tp.oninput = () => { d.topic = tp.value; touch(); };
  const dl = $("#topiclist"); dl.innerHTML = "";
  [...new Set(D.map(x => x.topic).filter(Boolean))].forEach(t => {
    const o = document.createElement("option"); o.value = t; dl.appendChild(o);
  });

  const sc = $("#esrc"); sc.value = d.source || "";
  sc.oninput = () => { d.source = sc.value; touch(); };

  const lv = $("#elvl"); lv.innerHTML = "";
  for(let i = 1; i <= 5; i++){
    const b = el("button", (d.level >= i ? "on" : null), i);
    b.title = ["ぼんやり","説明を追える","要点を言える","人に教えられる","応用できる"][i-1];
    b.onclick = () => { d.level = (d.level === i ? 0 : i); touch(); renderEdit(); };
    lv.appendChild(b);
  }

  const tg = $("#etags"); tg.innerHTML = "";
  (d.tags||[]).forEach((t, i) => {
    const b = el("button","chip tag","#" + t);
    b.onclick = () => { if(confirm("#" + t + " を外しますか。")){
      d.tags.splice(i,1); touch(); renderEdit(); } };
    tg.appendChild(b);
  });
  const at = el("button","chip add","＋ タグ");
  at.onclick = () => {
    const v = prompt("タグ（# は不要）");
    if(v && v.trim()){ d.tags = [...(d.tags||[]), v.trim().replace(/^#/,"")]; touch(); renderEdit(); }
  };
  tg.appendChild(at);

  const sm = $("#esummary"); sm.value = d.summary || "";
  sm.oninput = () => { d.summary = sm.value; touch(); autoGrow(sm); };
  autoGrow(sm);

  const ap = $("#eapplied"); ap.value = d.applied || "";
  ap.oninput = () => { d.applied = ap.value; touch(); autoGrow(ap); };
  autoGrow(ap);

  renderBlocks();
}

function renderBlocks(){
  const box = $("#blocks"); box.innerHTML = "";
  (cur.blocks||[]).forEach((b, i) => box.appendChild(blockEl(b, i)));
}
function blockEl(b, i){
  const w = el("div","bl");
  const del = el("button","del","×");
  del.onclick = () => {
    if((b.text||b.expr||b.q||b.file||"").length && !confirm("この部分を消しますか。")) return;
    cur.blocks.splice(i,1); touch(); renderBlocks();
  };
  w.appendChild(del);

  if(b.type === "text" || b.type === "heading"){
    const t = el("textarea","ed" + (b.type === "heading" ? " h" : ""));
    t.value = b.text || "";
    t.placeholder = b.type === "heading" ? "見出し"
      : "ここに書きます。キーボードのマイクで話しても入ります。";
    t.oninput = () => { b.text = t.value; touch(); autoGrow(t); };
    w.appendChild(t); setTimeout(() => autoGrow(t), 0);
  }
  else if(b.type === "image"){
    const c = el("div","imgbl");
    if(b.data){ const im = el("img"); im.src = b.data; im.alt = b.caption || "写真"; c.appendChild(im); }
    const cap = el("input"); cap.placeholder = "説明（任意）"; cap.value = b.caption || "";
    cap.oninput = () => { b.caption = cap.value; touch(); };
    c.appendChild(cap); w.appendChild(c);
  }
  else if(b.type === "formula"){
    if(!b.symbols) b.symbols = [["","",""]];
    const c = el("div","fbl");
    const t = el("textarea");
    t.value = b.expr || "";
    t.placeholder = "例: Fx = mu * Fz * (1 - exp(-j/K))";
    t.oninput = () => { b.expr = t.value; touch(); autoGrow(t); };
    c.appendChild(t); setTimeout(() => autoGrow(t), 0);
    b.symbols.forEach((row, ri) => {
      const r = el("div","symrow");
      ["記号","意味","単位"].forEach((ph, ci) => {
        const inp = el("input"); inp.placeholder = ph; inp.value = row[ci] || "";
        inp.oninput = () => { b.symbols[ri][ci] = inp.value; touch(); };
        r.appendChild(inp);
      });
      c.appendChild(r);
    });
    const more = el("button","more","＋ 記号を足す");
    more.onclick = () => { b.symbols.push(["","",""]); touch(); renderBlocks(); };
    c.appendChild(more); w.appendChild(c);
  }
  else if(b.type === "qa"){
    const c = el("div","qbl");
    const q = el("textarea"); q.value = b.q || ""; q.placeholder = "自分への問い";
    q.oninput = () => { b.q = q.value; touch(); autoGrow(q); };
    const a = el("textarea"); a.value = b.a || ""; a.placeholder = "答え";
    a.oninput = () => { b.a = a.value; touch(); autoGrow(a); };
    c.append(q, a); w.appendChild(c);
    setTimeout(() => { autoGrow(q); autoGrow(a); }, 0);
  }
  return w;
}
document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
  const t = b.dataset.add;
  if(t === "image"){ $("#filepick").click(); return; }
  if(t === "paste"){ pasteImage(); return; }

/* --- 写真。メールが重くならないように縮めてから入れます --- */
$("#filepick").onchange = e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  shrink(f, 1600, 0.72).then(data => {
    cur.blocks.push({type:"image", data:data, caption:""});
    touch(); renderBlocks();
    toast("写真を入れました（約" + Math.round(data.length/1365) + "KB）");
  }).catch(() => toast("写真を読めませんでした", true));
};
/* クリップボードにある画像を貼ります。
   スクリーンショットを撮って「コピー」した直後などに使えます。 */
async function pasteImage(){
  if(!navigator.clipboard || !navigator.clipboard.read){
    toast("この端末では貼り付けが使えません。「＋ 写真」を使ってください", true);
    return;
  }
  try{
    const items = await navigator.clipboard.read();
    for(const it of items){
      const type = (it.types||[]).find(t => t.startsWith("image/"));
      if(!type) continue;
      const blob = await it.getType(type);
      const data = await shrink(blob, 1600, 0.72);
      cur.blocks.push({type:"image", data:data, caption:""});
      touch(); renderBlocks();
      toast("貼り付けました（約" + Math.round(data.length/1365) + "KB）");
      return;
    }
    toast("クリップボードに画像がありません", true);
  }catch(e){
    if(e && e.name === "NotAllowedError")
      toast("貼り付けの許可を出してください。もう一度押すと聞かれます", true);
    else
      toast("貼り付けられませんでした。「＋ 写真」を使ってください", true);
  }
}
/* キーボードや外部から貼られたときも拾います */
document.addEventListener("paste", e => {
  if(view !== "edit" || !cur) return;
  const items = [...((e.clipboardData && e.clipboardData.items) || [])]
    .filter(i => i.type && i.type.startsWith("image/"));
  if(!items.length) return;
  e.preventDefault();
  const f = items[0].getAsFile();
  if(!f) return;
  shrink(f, 1600, 0.72).then(data => {
    cur.blocks.push({type:"image", data:data, caption:""});
    touch(); renderBlocks(); toast("貼り付けました");
  }).catch(() => toast("貼り付けられませんでした", true));
});
function shrink(file, maxSide, quality){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        let {width:w, height:h} = img;
        const k = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w*k); h = Math.round(h*k);
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        res(cv.toDataURL("image/jpeg", quality));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* --- AI に要約してもらう。鍵を持たないので、コピーと貼り戻しで橋渡しします --- */
function aiPromptFor(d){
  const body = (d.blocks||[]).map(b => {
    if(b.type === "heading") return "\n## " + (b.text||"");
    if(b.type === "text")    return b.text || "";
    if(b.type === "formula") return "【式】" + (b.expr||"") + "\n" +
      (b.symbols||[]).filter(r => r[0]).map(r => "  " + r[0] + " = " + r[1] + " [" + r[2] + "]").join("\n");
    if(b.type === "qa")      return "【問い】" + (b.q||"") + "\n【答え】" + (b.a||"");
    if(b.type === "image")   return "【写真】" + (b.caption || "説明なし");
    return "";
  }).filter(x => x && x.trim()).join("\n");
  return [
"次の勉強メモを、3行以内の日本語で要約してください。",
"前置きや見出しは付けず、要約の本文だけを返してください。",
"数値と固有名詞はメモの表記のまま使い、書かれていないことを足さないでください。",
"",
"題名: " + (d.title || "なし"),
"分野: " + (d.field || "") + " / テーマ: " + (d.topic || "なし"),
"出典: " + (d.source || "なし"),
"---",
body || "（本文なし）"
].join("\n");
}

/* =====================================================================
   8. 会社に送る
   ===================================================================== */
function buildPackage(ids){
  return {
    app: "MemoNote-Mobile", version: 1, appVersion: APP_VERSION,
    sentAt: nowISO(),
    drafts: D.filter(d => ids.includes(d.id)).map(d => ({
      id: d.id, createdAt: d.createdAt, kind: "study",
      title: d.title, field: d.field, topic: d.topic, source: d.source,
      level: d.level, tags: d.tags || [], summary: d.summary || "",
      applied: d.applied || "",
      blocks: d.blocks || []
    }))
  };
}
/* 送り方を選ぶ画面。写真の有無と大きさで、使える手段が変わります。 */
function share(){
  const ids = [...picked];
  if(!ids.length){ toast("送るものを選んでください", true); return; }
  const pkg = buildPackage(ids);
  const text = JSON.stringify(pkg);
  const kb = Math.round(text.length/1024);
  const hasImg = pkg.drafts.some(d => (d.blocks||[]).some(b => b.type === "image"));
  /* メールの本文に入れられる長さの目安。これを超えると途中で切られることがあります */
  const canMail = !hasImg && text.length < 1800;

  SIN.innerHTML = "";
  SIN.appendChild(el("h3", null, "会社に送る"));
  SIN.appendChild(el("p", null,
    ids.length + "件 ・ " + kb + "KB" + (hasImg ? " ・ 写真あり" : "")));

  const mk = (label, sub, cls, fn) => {
    const b = el("button","big" + (cls||""), label);
    b.style.cssText = "width:100%;margin-bottom:10px;text-align:left;padding:14px 16px";
    if(sub){ const s2 = el("div");
      s2.style.cssText = "font-size:12px;color:var(--tx-faint);font-weight:400;margin-top:2px";
      s2.textContent = sub; b.appendChild(s2); }
    b.onclick = fn;
    SIN.appendChild(b);
    return b;
  };

  if(canMail && SET.mailTo){
    mk("メールを開いて送る", "宛先も中身も入った状態で開きます。送信を押すだけです", "", () => {
      closeSheet();
      const url = "mailto:" + encodeURIComponent(SET.mailTo) +
        "?subject=" + encodeURIComponent("MemoNote# 勉強ノート " + ids.length + "件") +
        "&body=" + encodeURIComponent(text);
      location.href = url;
      markSent(ids, kb);
    });
  } else if(canMail && !SET.mailTo){
    mk("会社アドレスを登録する", "登録すると、写真なしのノートは1タップで送れます", " ghost", () => {
      closeSheet(); openMailSetting();
    });
  }

  mk(hasImg ? "共有して送る（写真も送れる）" : "共有して送る",
     SET.mailTo ? "メールアプリを選びます。宛先はコピーしてあるので長押しで貼れます"
                : "メールアプリを選びます", hasImg ? "" : " ghost",
     () => { closeSheet(); shareFile(ids, pkg, text, kb); });

  mk("ファイルに保存する", "あとから手で添付します", " ghost", () => {
    closeSheet(); saveFile(pkg, text); markSent(ids, kb);
  });

  const c = el("button","big ghost","やめる");
  c.style.cssText = "width:100%;margin-top:4px";
  c.onclick = closeSheet;
  SIN.appendChild(c);
  SHEET.classList.add("on");
}
function pkgFile(pkg, text){
  /* 社内のメールで .json が落とされることがあるので .txt で送ります */
  const name = "MemoNote_" + pkg.sentAt.replace(/[-:T]/g,"").slice(0,12) + ".txt";
  return new File([text], name, {type:"text/plain"});
}
async function shareFile(ids, pkg, text, kb){
  const file = pkgFile(pkg, text);
  const subject = "MemoNote# 勉強ノート " + ids.length + "件";
  if(SET.mailTo){
    try{ await navigator.clipboard.writeText(SET.mailTo); }catch(_){}
  }
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:subject, text:subject});
      markSent(ids, kb);
      return;
    }
  }catch(e){
    if(e && e.name === "AbortError") return;   /* 本人が取り消した */
  }
  saveFile(pkg, text);
  markSent(ids, kb);
}
function saveFile(pkg, text){
  const file = pkgFile(pkg, text);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("保存しました。メールに添付して送ってください");
}
function markSent(ids, kb){
  const t = nowISO();
  D.forEach(d => { if(ids.includes(d.id)) d.sentAt = t; });
  picked = new Set(); saveNow();
  toast(ids.length + "件を送信にまわしました（" + kb + "KB）");
  go("list");
}
function openMailSetting(){
  SIN.innerHTML = "";
  SIN.appendChild(el("h3", null, "会社アドレス"));
  SIN.appendChild(el("p", null,

    "この端末の中にだけ保存されます。"));
  SIN.appendChild(el("label", null, "メールアドレス"));
  const inp = el("input"); inp.className = "fld"; inp.type = "email";
  inp.placeholder = "例: yourname@example.co.jp";
  inp.value = SET.mailTo || "";
  SIN.appendChild(inp);
  const btns = el("div","btns");
  const c = el("button","big ghost","やめる"); c.onclick = closeSheet;
  const ok = el("button","big","保存");
  ok.onclick = () => { SET.mailTo = inp.value.trim(); saveSet(); closeSheet();
    toast(SET.mailTo ? "登録しました" : "宛先を空にしました"); };
  btns.append(c, ok); SIN.appendChild(btns);

}

$("#restorepick").onchange = e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      const arr = Array.isArray(o) ? o : (o.drafts || []);
      if(!arr.length){ toast("下書きが入っていません", true); return; }
      const have = new Set(D.map(d => d.id));
      const add = arr.filter(d => d && d.id && !have.has(d.id));
      D = D.concat(add); saveNow(); renderList(); renderBottom();
      toast(add.length + "件を読み込みました");
    }catch(_){ toast("読めないファイルです", true); }
  };
  r.readAsText(f);
};

/* =====================================================================
   10. 起動
   ===================================================================== */
function boot(){
  load();
  const q = new URLSearchParams(location.search);
  const shared = q.get("title") || q.get("text") || q.get("url");
  if(shared){
    /* 他のアプリから共有されてきたとき */
    const url = q.get("url") || "";
    const txt = q.get("text") || "";
    const ttl = q.get("title") || (txt.split("\n")[0] || "").slice(0,40);
    newDraft({
      title: ttl || "共有されたもの",
      source: url || (txt.match(/https?:\/\/\S+/) || [""])[0],
      blocks: [{type:"heading", text:"要点"},
               {type:"text", text: txt && txt !== ttl ? txt : ""},
               {type:"heading", text:"自分の言葉で"},
               {type:"text", text:""}]
    });
    history.replaceState(null, "", location.pathname);
    toast("共有から下書きを作りました");
    return;
  }
  if(q.get("new")){
    history.replaceState(null, "", location.pathname);
    newDraft(); return;
  }
  go("list");
}
window.addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", () => { if(document.hidden) saveNow(); });
if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
boot();
